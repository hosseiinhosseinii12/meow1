<body data-page="admin-login">
<main class="admin-login" id="main">
  <div class="admin-login__card load-in">
    <div class="u-center"><a class="wordmark" href="../index.html" style="font-size:1.35rem">Verdant<small>Atelier</small></a></div>
    <div class="u-center"><h1 class="u-3xl">Staff sign in</h1><p class="u-soft u-sm u-mt-2">For members of the Maison Verdant team.</p></div>
    <form id="admin-login-form" class="form-grid" data-validate>
      <div class="field"><label class="field__label" for="al-email">Email</label><input class="field__control" id="al-email" name="email" type="email" autocomplete="username" required value="charlotte@maisonverdant.com"></div>

      <label class="check"><input type="checkbox" checked> Keep me signed in on this device</label>
      <button class="btn btn--block" type="submit">Sign in</button>
    </form>
    <p class="u-xs u-muted u-center">Demo access: any password of eight or more characters.</p>
  </div>
</main>
