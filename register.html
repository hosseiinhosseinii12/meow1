<div class="auth">
  <div class="auth__form"><div class="auth__card load-in">
    <a class="wordmark" href="index.html" style="font-size:1.25rem">Verdant</a>
    <div><h1>Create an account</h1><p class="u-soft u-mt-2">Track orders, save your wishlist and enjoy early access to private sales.</p></div>
    <form id="register-form" class="form-grid" data-validate>
      <div class="form-grid form-grid--2"><div class="field"><label class="field__label" for="first">First name</label><input class="field__control" id="first" name="first" autocomplete="given-name" required><p class="field__error"></p></div><div class="field"><label class="field__label" for="last">Last name</label><input class="field__control" id="last" name="last" autocomplete="family-name" required><p class="field__error"></p></div></div>
      <div class="field"><label class="field__label" for="email">Email</label><input class="field__control" id="email" name="email" type="email" autocomplete="email" required><p class="field__error"></p></div>
      <div class="field"><label class="field__label" for="password">Password</label><div class="field__wrap"><input class="field__control" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" data-strength="password-meter"><button class="field__toggle" type="button" data-toggle-password aria-label="Show password" aria-pressed="false"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="strength" id="password-meter" data-level="0" aria-hidden="true"><span></span><span></span><span></span></div><p class="strength__label" aria-live="polite">Use eight or more characters</p><p class="field__error"></p></div>
      <label class="check"><input type="checkbox" name="terms" required> I agree to the <a href="terms.html">terms</a> and <a href="privacy.html">privacy policy</a></label>
      <label class="check"><input type="checkbox" name="letter"> Send me the monthly letter</label>
      <button class="btn btn--block" type="submit">Create account</button>
    </form><div class="divider">or</div><div class="social-btns"><button class="btn btn--ghost" type="button" data-social="Google"><svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3Z"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9Z"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6Z"/></svg> Google</button><button class="btn btn--ghost" type="button" data-social="GitHub"><svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg> GitHub</button></div>
    <p class="u-sm u-soft u-center">Already a client? <a href="login.html">Sign in</a></p>
